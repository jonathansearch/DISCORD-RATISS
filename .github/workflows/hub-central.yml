name: Hub central Discord

on:
  workflow_dispatch:
    inputs:
      salon:
        description: "Nom logique du salon, ou all pour tous les webhooks"
        required: true
        type: string
      statut:
        description: "OK, ECHEC ou INFO"
        required: false
        default: "INFO"
        type: string
      titre:
        description: "Titre du message"
        required: false
        default: "Message du hub RATISS"
        type: string
      details:
        description: "Détails du message"
        required: false
        default: ""
        type: string
      lien:
        description: "Lien facultatif"
        required: false
        default: ""
        type: string
      test_seul:
        description: "Envoyer uniquement un test de connexion"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  notifier:
    name: Notifier le salon sélectionné
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOKS_JSON: ${{ secrets.DISCORD_WEBHOOKS_JSON }}
      RATISS: ${{ secrets.RATISS }}
      RATISS2: ${{ secrets.RATISS2 }}
      RATISS3: ${{ secrets.RATISS3 }}
      RATISS4: ${{ secrets.RATISS4 }}
      RATISS5: ${{ secrets.RATISS5 }}
      RATISS6: ${{ secrets.RATISS6 }}
      RATISS7: ${{ secrets.RATISS7 }}
      RATISS8: ${{ secrets.RATISS8 }}
      RATISS9: ${{ secrets.RATISS9 }}
      RATISS10: ${{ secrets.RATISS10 }}
      RATISS11: ${{ secrets.RATISS11 }}
      RATISS12: ${{ secrets.RATISS12 }}
      RATISS13: ${{ secrets.RATISS13 }}
      RATISS14: ${{ secrets.RATISS14 }}
      RATISS15: ${{ secrets.RATISS15 }}
      RATISS16: ${{ secrets.RATISS16 }}
      RATISS17: ${{ secrets.RATISS17 }}
      RATISS18: ${{ secrets.RATISS18 }}
      RATISS19: ${{ secrets.RATISS19 }}
      RATISS20: ${{ secrets.RATISS20 }}
      RATISS21: ${{ secrets.RATISS21 }}
      RATISS22: ${{ secrets.RATISS22 }}
      RATISS23: ${{ secrets.RATISS23 }}
      SALON: ${{ inputs.salon }}
      STATUT: ${{ inputs.statut }}
      TITRE: ${{ inputs.titre }}
      DETAILS: ${{ inputs.details }}
      LIEN: ${{ inputs.lien }}
      TEST_SEUL: ${{ inputs.test_seul }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la configuration sans afficher les clés
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DISCORD_WEBHOOKS_JSON:-}" ]] && [[ -z "${RATISS:-}" ]]; then
            echo "::error::Aucun secret RATISS ou DISCORD_WEBHOOKS_JSON n'est configuré."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys
          raw = os.environ.get("DISCORD_WEBHOOKS_JSON", "").strip()
          if raw:
              try:
                  routes = json.loads(raw)
              except json.JSONDecodeError:
                  print("::error::DISCORD_WEBHOOKS_JSON n'est pas un JSON valide.")
                  sys.exit(1)
          else:
              names = ["RATISS"] + [f"RATISS{i}" for i in range(2, 24)]
              routes = {name: os.environ[name] for name in names if os.environ.get(name, "").strip()}
          if not isinstance(routes, dict) or not routes:
              print("::error::Aucun webhook configuré dans RATISS à RATISS23.")
              sys.exit(1)
          salon = os.environ["SALON"]
          if salon != "all" and salon not in routes:
              print("::error::Salon non configuré : " + salon)
              print("Salons disponibles : " + ", ".join(sorted(routes)))
              sys.exit(1)
          selected = routes.values() if salon == "all" else [routes[salon]]
          for webhook in selected:
              if not isinstance(webhook, str) or not webhook.startswith(("https://discord.com/api/webhooks/", "https://discordapp.com/api/webhooks/")):
                  print("::error::Un webhook configuré n'est pas une URL Discord valide.")
                  sys.exit(1)
          print("Configuration valide pour : " + ("tous les salons" if salon == "all" else salon))
          PY

      - name: Test de connexion
        if: env.TEST_SEUL == 'true'
        shell: bash
        run: python3 agent.py --salon "$SALON" --test

      - name: Envoyer la notification
        if: env.TEST_SEUL != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 agent.py \
            --salon "$SALON" \
            --statut "$STATUT" \
            --titre "$TITRE" \
            --details "$DETAILS" \
            --lien "$LIEN"
