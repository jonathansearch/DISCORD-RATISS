name: Hub central Discord

on:
  workflow_dispatch:
    inputs:
      salon:
        description: "Nom logique du salon configuré dans DISCORD_WEBHOOKS_JSON"
        required: true
        type: string
      statut:
        description: "OK, ECHEC ou INFO"
        required: false
        default: "INFO"
        type: string
      titre:
        description: "Titre du message"
        required: false
        default: "Message du hub RATISS"
        type: string
      details:
        description: "Détails du message"
        required: false
        default: ""
        type: string
      lien:
        description: "Lien facultatif"
        required: false
        default: ""
        type: string
      test_seul:
        description: "Envoyer uniquement un test de connexion"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  notifier:
    name: Notifier le salon sélectionné
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOKS_JSON: ${{ secrets.DISCORD_WEBHOOKS_JSON }}
      SALON: ${{ inputs.salon }}
      STATUT: ${{ inputs.statut }}
      TITRE: ${{ inputs.titre }}
      DETAILS: ${{ inputs.details }}
      LIEN: ${{ inputs.lien }}
      TEST_SEUL: ${{ inputs.test_seul }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la configuration sans afficher les clés
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DISCORD_WEBHOOKS_JSON:-}" ]]; then
            echo "::error::Le secret DISCORD_WEBHOOKS_JSON est absent ou vide."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys
          try:
              routes = json.loads(os.environ["DISCORD_WEBHOOKS_JSON"])
          except json.JSONDecodeError:
              print("::error::DISCORD_WEBHOOKS_JSON n'est pas un JSON valide.")
              sys.exit(1)
          if not isinstance(routes, dict) or not routes:
              print("::error::DISCORD_WEBHOOKS_JSON doit contenir au moins un salon.")
              sys.exit(1)
          salon = os.environ["SALON"]
          if salon not in routes:
              print("::error::Salon non configuré : " + salon)
              print("Salons disponibles : " + ", ".join(sorted(routes)))
              sys.exit(1)
          webhook = routes[salon]
          if not isinstance(webhook, str) or not webhook.startswith(("https://discord.com/api/webhooks/", "https://discordapp.com/api/webhooks/")):
              print("::error::Le webhook du salon sélectionné n'est pas une URL Discord valide.")
              sys.exit(1)
          print("Configuration valide pour le salon : " + salon)
          PY

      - name: Test de connexion
        if: env.TEST_SEUL == 'true'
        shell: bash
        run: python3 agent.py --salon "$SALON" --test

      - name: Envoyer la notification
        if: env.TEST_SEUL != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 agent.py \
            --salon "$SALON" \
            --statut "$STATUT" \
            --titre "$TITRE" \
            --details "$DETAILS" \
            --lien "$LIEN"
