name: Run agent with Discord webhook

on:
  workflow_dispatch:

# A Discord webhook only needs outbound HTTPS. No GitHub write permissions are required.
permissions:
  contents: read

jobs:
  agent:
    name: Run agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # RATISS remains available for compatibility with the existing agent.
      RATISS: ${{ secrets.RATISS }}
      # Preferred, explicit name for a Discord webhook URL.
      DISCORD_WEBHOOK_URL: ${{ secrets.RATISS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Discord webhook is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DISCORD_WEBHOOK_URL:-}" ]]; then
            echo "The RATISS repository secret is not configured or is empty."
            exit 1
          fi
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*)
              echo "Discord webhook is configured (URL hidden)."
              ;;
            *)
              echo "RATISS is not a recognized Discord webhook URL."
              exit 1
              ;;
          esac

      - name: Run agent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x ./agent ]]; then
            ./agent
          elif [[ -f ./agent.py ]]; then
            python3 ./agent.py
          elif [[ -f ./agent.js ]]; then
            node ./agent.js
          else
            echo "No agent entrypoint found. Add an executable ./agent, agent.py, or agent.js."
            exit 1
          fi
